{% if messages %}
  <div class="container" style="margin-top: 1rem;">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">
        <span>{{ message }}</span>
        <button type="button" style="background: none; border: none; cursor: pointer; color: inherit;" onclick="this.parentElement.remove();">&times;</button>
      </div>
    {% endfor %}
  </div>
{% endif %}
